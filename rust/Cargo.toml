[package]
name = "voice_flutter"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# Pinned to a commit on voice-core main until 0.1.0 is on crates.io.
voice-core = { git = "https://github.com/aunai-org/voice-core", rev = "0fbd60418fd0507d3af2a15e16745e1276908391" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# wasm-pack would download binaryen's wasm-opt, which is not needed for the
# web build and fails behind a restricted network.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
