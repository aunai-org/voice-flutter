name: macOS
# Not run per PR (runner cost); main and tags only.
on:
  push:
    branches: [main]
    tags: ['v*']
  # Press Run workflow and tick "latest" to try the newest stable Flutter and
  # Rust instead of the pinned versions (tells you when a bump is due).
  workflow_dispatch:
    inputs:
      latest:
        description: Use the newest stable Flutter and Rust instead of the pinned ones
        type: boolean
        default: false

jobs:
  test:
    name: test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.latest && 'stable' || '1.100.0' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust tests
        working-directory: rust
        run: cargo test
