name: Windows
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Press Run workflow and tick "latest" to try the newest stable Flutter and
  # Rust instead of the pinned versions (tells you when a bump is due).
  workflow_dispatch:
    inputs:
      latest:
        description: Use the newest stable Flutter and Rust instead of the pinned ones
        type: boolean
        default: false

jobs:
  test:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.latest && 'stable' || '1.100.0' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.latest && '' || '3.47.7' }}
          cache: true
      - name: Rust tests
        working-directory: rust
        run: cargo test
      - name: Build the example app for Windows
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --debug
