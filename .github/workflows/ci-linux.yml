name: Linux
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Press Run workflow and tick "latest" to try the newest stable Flutter and
  # Rust instead of the pinned versions (tells you when a bump is due).
  workflow_dispatch:
    inputs:
      latest:
        description: Use the newest stable Flutter and Rust instead of the pinned ones
        type: boolean
        default: false

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.latest && 'stable' || '1.100.0' }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.latest && '' || '3.47.7' }}
          cache: true
      - run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Rust fmt, clippy, test
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - run: flutter pub get
      - name: Generated bindings are up to date
        run: |
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib rust/src
      - run: flutter analyze
      - name: Dart tests (call the native library)
        run: |
          cargo build --manifest-path rust/Cargo.toml
          flutter test
