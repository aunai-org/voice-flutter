name: Android
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Press Run workflow and tick "latest" to try the newest stable Flutter and
  # Rust instead of the pinned versions (tells you when a bump is due).
  workflow_dispatch:
    inputs:
      latest:
        description: Use the newest stable Flutter and Rust instead of the pinned ones
        type: boolean
        default: false

jobs:
  build:
    name: build (android-apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.latest && 'stable' || '1.100.0' }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.latest && '' || '3.47.7' }}
          cache: true
      - name: Build the example app (cargokit builds the Rust library with the NDK)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-arm64
